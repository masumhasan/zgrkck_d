<!-- Content Body -->
<main class="flex-1 max-w-4xl w-full mx-auto px-6 py-10">
<!-- Section Header -->
<div class="text-center mb-8">
<h2 class="font-serif text-3xl font-medium text-stone-900 tracking-tight">Define a New Subscription Tier</h2>
<p class="text-xs text-stone-500 mt-1.5 font-normal">Configure features, limits, and pricing for Mealist.ai.</p>
</div>
<!-- Main Form Container -->
<form class="bg-white rounded-md border border-stone-200 p-8 shadow-sm">
<!-- SECTION 1: Basic Information -->
<section class="mb-8" data-purpose="section-basic-information">
<h3 class="font-serif text-lg font-medium text-stone-900 pb-2 border-b border-stone-100">1. Basic Information</h3>
<div class="mt-5 grid grid-cols-1 md:grid-cols-2 gap-5">
<!-- Plan Name -->
<div>
<label class="block text-[10px] font-bold text-stone-700 uppercase tracking-wider mb-1.5">PLAN NAME</label>
<input class="w-full text-xs text-stone-800 placeholder-stone-400 border border-stone-300 rounded px-3 py-2 focus:ring-1 focus:ring-brand focus:border-brand" placeholder="e.g., Plus Pro" type="text"/>
</div>
<!-- Billing Cycle -->
<div>
<label class="block text-[10px] font-bold text-stone-700 uppercase tracking-wider mb-1.5">BILLING CYCLE</label>
<select class="w-full text-xs text-stone-800 border border-stone-300 rounded px-3 py-2 focus:ring-1 focus:ring-brand focus:border-brand bg-white">
<option selected="">Monthly</option>
<option>Quarterly</option>
<option>Yearly</option>
</select>
</div>
</div>
<!-- Description -->
<div class="mt-5">
<label class="block text-[10px] font-bold text-stone-700 uppercase tracking-wider mb-1.5">DESCRIPTION</label>
<input class="w-full text-xs text-stone-800 placeholder-stone-400 border border-stone-300 rounded px-3 py-2 focus:ring-1 focus:ring-brand focus:border-brand" placeholder="Short summary of the plan benefits..." type="text"/>
</div>
<!-- Price -->
<div class="mt-5">
<label class="block text-[10px] font-bold text-stone-700 uppercase tracking-wider mb-1.5">PRICE</label>
<div class="relative w-full md:w-1/2">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-stone-500 text-xs">$</span>
<input class="w-full text-xs text-stone-800 placeholder-stone-400 border border-stone-300 rounded pl-7 pr-3 py-2 focus:ring-1 focus:ring-brand focus:border-brand" placeholder="0.00" type="text"/>
</div>
</div>
</section>
<!-- SECTION 2: Features & Limits -->
<section class="mb-8" data-purpose="section-features-limits">
<h3 class="font-serif text-lg font-medium text-stone-900 pb-2 border-b border-stone-100">2. Features &amp; Limits</h3>
<div class="mt-5 grid grid-cols-1 md:grid-cols-2 gap-5">
<!-- AI Operations Limit -->
<div>
<label class="block text-[10px] font-bold text-stone-700 uppercase tracking-wider mb-1.5">AI OPERATIONS LIMIT (PER MONTH)</label>
<input class="w-full text-xs text-stone-800 placeholder-stone-400 border border-stone-300 rounded px-3 py-2 focus:ring-1 focus:ring-brand focus:border-brand" placeholder="e.g., 5000" type="text"/>
</div>
<!-- Recipe Save Limit -->
<div>
<label class="block text-[10px] font-bold text-stone-700 uppercase tracking-wider mb-1.5">RECIPE SAVE LIMIT</label>
<input class="w-full text-xs text-stone-800 placeholder-stone-400 border border-stone-300 rounded px-3 py-2 focus:ring-1 focus:ring-brand focus:border-brand" placeholder="e.g., 100 or Unlimited" type="text"/>
</div>
</div>
<!-- Premium Features Options -->
<div class="mt-5">
<label class="block text-[10px] font-bold text-stone-700 uppercase tracking-wider mb-2">PREMIUM FEATURES</label>
<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
<!-- Feature 1: Cook Mode -->
<label class="flex items-center px-4 py-3 rounded border border-stone-200 hover:border-stone-300 cursor-pointer transition-colors bg-white">
<input class="h-4 w-4 rounded border-stone-300 text-brand focus:ring-brand" type="checkbox"/>
<span class="ml-3 text-xs font-medium text-stone-800">Cook Mode</span>
</label>
<!-- Feature 2: Ad-free Experience -->
<label class="flex items-center px-4 py-3 rounded border border-stone-200 hover:border-stone-300 cursor-pointer transition-colors bg-white">
<input class="h-4 w-4 rounded border-stone-300 text-brand focus:ring-brand" type="checkbox"/>
<span class="ml-3 text-xs font-medium text-stone-800">Ad-free Experience</span>
</label>
<!-- Feature 3: Nutrition AI Insights -->
<label class="flex items-center px-4 py-3 rounded border border-stone-200 hover:border-stone-300 cursor-pointer transition-colors bg-white">
<input class="h-4 w-4 rounded border-stone-300 text-brand focus:ring-brand" type="checkbox"/>
<span class="ml-3 text-xs font-medium text-stone-800">Nutrition AI Insights</span>
</label>
<!-- Feature 4: Priority Support -->
<label class="flex items-center px-4 py-3 rounded border border-stone-200 hover:border-stone-300 cursor-pointer transition-colors bg-white">
<input class="h-4 w-4 rounded border-stone-300 text-brand focus:ring-brand" type="checkbox"/>
<span class="ml-3 text-xs font-medium text-stone-800">Priority Support</span>
</label>
</div>
</div>
</section>
<!-- SECTION 3: Status -->
<section class="mb-10" data-purpose="section-status">

<div class="mt-4">
<label class="block text-[10px] font-bold text-stone-700 uppercase tracking-wider mb-2">INITIAL STATUS</label>
<div class="flex items-center space-x-6">
<!-- Draft Radio -->
<label class="inline-flex items-center cursor-pointer">
<input checked="" class="h-4 w-4 border-stone-300 text-brand focus:ring-brand" name="status" type="radio" value="draft"/>
<span class="ml-2 text-xs text-stone-800">Draft</span>
</label>
<!-- Active Radio -->
<label class="inline-flex items-center cursor-pointer">
<input class="h-4 w-4 border-stone-300 text-brand focus:ring-brand" name="status" type="radio" value="active"/>
<span class="ml-2 text-xs text-stone-800">Active</span>
</label>
<!-- Hidden Radio -->
<label class="inline-flex items-center cursor-pointer">
<input class="h-4 w-4 border-stone-300 text-brand focus:ring-brand" name="status" type="radio" value="hidden"/>
<span class="ml-2 text-xs text-stone-800">Hidden</span>
</label>
</div>
</div>
</section>
<!-- Form Actions -->
<div class="flex justify-end items-center space-x-3 pt-4">
<button class="px-5 py-2 text-xs font-medium text-stone-700 bg-white border border-stone-300 rounded hover:bg-stone-50 transition-colors shadow-sm" type="button">
            Cancel
          </button>
<button class="px-5 py-2 text-xs font-medium text-white bg-brand hover:bg-brand-hover rounded transition-colors shadow-sm" type="submit">
            Create Plan
          </button>
</div>
</form>
